name: repairly
services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${DB_NAME:-repairly}
      POSTGRES_USER: ${DB_USER:-repairly}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Запустите backend/init-env.sh или init-env.ps1}
    ports:
      - "127.0.0.1:${DB_PORT:-55434}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 2s
      timeout: 3s
      retries: 30
  backend:
    build: ./backend
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/${DB_NAME:-repairly}
      SPRING_DATASOURCE_USERNAME: ${DB_USER:-repairly}
      SPRING_DATASOURCE_PASSWORD: ${DB_PASSWORD:?Укажите DB_PASSWORD}
      JWT_SECRET_BASE64: ${JWT_SECRET_BASE64:?Запустите backend/init-env.sh или init-env.ps1}
      JWT_ISSUER: repairly
      ACCESS_TOKEN_MINUTES: ${ACCESS_TOKEN_MINUTES:-15}
      REFRESH_TOKEN_DAYS: ${REFRESH_TOKEN_DAYS:-14}
      BOOTSTRAP_ADMIN_EMAIL: ${BOOTSTRAP_ADMIN_EMAIL:-admin@repairly.local}
      BOOTSTRAP_ADMIN_NAME: ${BOOTSTRAP_ADMIN_NAME:-Администратор Repairly}
      BOOTSTRAP_ADMIN_PASSWORD: ${BOOTSTRAP_ADMIN_PASSWORD:?Укажите временный пароль администратора}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:8080}
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
      PERMANENT_DELETE_ENABLED: ${PERMANENT_DELETE_ENABLED:-true}
    ports:
      - "127.0.0.1:${APP_PORT:-8080}:8080"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://localhost:8080/actuator/health"]
      interval: 5s
      timeout: 3s
      start_period: 45s
      retries: 30
volumes:
  postgres_data:
